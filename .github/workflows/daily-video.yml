name: Auto Tạo Video TikTok

on:
  schedule:
    # Chạy 9h sáng giờ VN mỗi ngày (2h UTC = 9h VN, UTC+7)
    - cron: "0 2 * * *"
  workflow_dispatch:
    # Cho phép chạy tay từ tab Actions trên GitHub, tùy chỉnh mọi tham số của main.py
    inputs:
      topic:
        description: "Chủ đề video (để trống = AI tự nghĩ chủ đề mới, tránh lặp lại chủ đề gần đây)"
        required: false
        default: ""
      background:
        description: "Kiểu nền video (để trống = slideshow, mặc định khi chạy trên GitHub Actions)"
        required: false
        type: choice
        options: ["", "physics", "slideshow"]
        default: ""
      voice:
        description: "Giọng đọc edge-tts (vd: vi-VN-NamMinhNeural, để trống = tự chọn theo lang)"
        required: false
        default: ""
      lang:
        description: "Ngôn ngữ kịch bản/giọng đọc (để trống = en, mặc định khi chạy trên GitHub Actions)"
        required: false
        default: ""
      rate:
        description: "Tốc độ đọc (vd: +20%, +0%, -10%)"
        required: false
        default: ""

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write  # cần để commit lại topic_history.txt sau mỗi lần chạy
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Cài Python dependencies
        run: pip install -r requirements.txt

      - name: Chạy pipeline tạo video
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: |
          # Trên GitHub Actions (chạy theo lịch cron LẪN chạy tay để trống input): mặc định
          # background=slideshow, lang=en — khác mặc định physics/vi khi chạy local (config.py).
          # Không dùng tên biến "LANG" vì trùng biến môi trường locale hệ thống, có thể ảnh hưởng
          # lệnh khác trong cùng step.
          BACKGROUND="${{ github.event.inputs.background }}"
          VIDEO_LANG="${{ github.event.inputs.lang }}"
          ARGS=(--background "${BACKGROUND:-slideshow}" --lang "${VIDEO_LANG:-en}")
          [ -n "${{ github.event.inputs.voice }}" ] && ARGS+=(--voice "${{ github.event.inputs.voice }}")
          [ -n "${{ github.event.inputs.rate }}" ] && ARGS+=(--rate "${{ github.event.inputs.rate }}")

          TOPIC="${{ github.event.inputs.topic }}"
          if [ -n "$TOPIC" ]; then
            python main.py "$TOPIC" "${ARGS[@]}"
          else
            python main.py "${ARGS[@]}"
          fi

      - name: Lưu lại lịch sử chủ đề (tránh AI lặp lại chủ đề ở lần chạy sau)
        # topic_history.py ghi topic_history.txt cục bộ trong runner — commit lại vào repo để lịch
        # sử không mất giữa các lần chạy CI (mỗi lần chạy là 1 checkout mới, không tự nhớ gì cả).
        # Dùng "git add" rồi kiểm tra staged diff (thay vì git diff thường) vì lần chạy ĐẦU TIÊN
        # topic_history.txt là file mới hoàn toàn (chưa track) — git diff thường bỏ sót file mới.
        if: always()
        run: |
          if [ -f topic_history.txt ]; then
            git add topic_history.txt
            if ! git diff --cached --quiet -- topic_history.txt; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git commit -m "chore: cập nhật lịch sử chủ đề"
              git push
            fi
          fi

      - name: Cảnh báo nếu TikTok cấp refresh_token mới
        # tiktok_poster.py có thể rotate refresh_token và ghi vào .env cục bộ (env_utils.py), nhưng
        # .env trong runner CI là tạm thời và biến mất sau khi job kết thúc — secret trên GitHub
        # KHÔNG tự cập nhật được (GITHUB_TOKEN mặc định không có quyền ghi secret). Bước này chỉ
        # cảnh báo (không in giá trị token ra log để tránh lộ secret) để biết đường cập nhật tay.
        if: always()
        run: |
          if [ -f .env ] && grep -q '^TIKTOK_REFRESH_TOKEN=' .env; then
            NEW_TOKEN=$(grep '^TIKTOK_REFRESH_TOKEN=' .env | cut -d'=' -f2-)
            if [ -n "$NEW_TOKEN" ] && [ "$NEW_TOKEN" != "${{ secrets.TIKTOK_REFRESH_TOKEN }}" ]; then
              echo "::warning::TikTok đã cấp refresh_token MỚI, khác với secret TIKTOK_REFRESH_TOKEN hiện tại. Secret chưa được tự động cập nhật. Nếu lần chạy tới báo lỗi đăng TikTok, hãy chạy lại 'python tiktok_auth.py' ở máy local rồi cập nhật secret TIKTOK_REFRESH_TOKEN trên GitHub (Settings > Secrets and variables > Actions)."
            fi
          fi

      - name: Upload video làm artifact (backup nếu Telegram/TikTok lỗi)
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_id }}
          path: output/*.mp4
          retention-days: 7
